<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Import products · NuORDER</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="app/helios.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--hl-bg); }
    #root { height: 100vh; display: flex; flex-direction: column; min-height: 0; }
    button:focus:not(:focus-visible) { outline: none; }
    button:focus-visible { outline: 2px solid var(--hl-go-blue); outline-offset: 2px; }
    select:focus-visible { outline: 2px solid var(--hl-go-blue); outline-offset: 2px; }

    /* Loader animation reused by all skeletons */
    @keyframes hl-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    @keyframes hl-pop {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#F0F4F4">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#F0F4F4"/>
      <!-- Card -->
      <g transform="translate(360 200)">
        <rect width="480" height="420" rx="8" fill="#fff" stroke="#BECBCF" stroke-width="4"/>
        <!-- Top header bar -->
        <rect x="0" y="0" width="480" height="60" fill="#3A4953" rx="8"/>
        <rect x="0" y="30" width="480" height="30" fill="#3A4953"/>
        <circle cx="30" cy="30" r="10" fill="#41AF4B"/>
        <rect x="50" y="22" width="80" height="16" rx="2" fill="#fff" opacity="0.9"/>
        <!-- Stepper -->
        <g transform="translate(40 100)">
          <circle cx="14" cy="14" r="14" fill="#41AF4B"/>
          <path d="M8 14 L12 18 L20 10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="32" y1="14" x2="100" y2="14" stroke="#41AF4B" stroke-width="3"/>
          <circle cx="114" cy="14" r="14" fill="#058DE9"/>
          <line x1="132" y1="14" x2="200" y2="14" stroke="#BECBCF" stroke-width="3"/>
          <circle cx="214" cy="14" r="14" fill="#fff" stroke="#BECBCF" stroke-width="3"/>
          <line x1="232" y1="14" x2="300" y2="14" stroke="#BECBCF" stroke-width="3"/>
          <circle cx="314" cy="14" r="14" fill="#fff" stroke="#BECBCF" stroke-width="3"/>
        </g>
        <!-- Mapping rows -->
        <g transform="translate(40 170)">
          <rect width="400" height="48" rx="3" fill="#fff" stroke="#41AF4B" stroke-width="2"/>
          <rect x="-2" y="0" width="6" height="48" fill="#41AF4B"/>
          <rect x="20" y="14" width="120" height="10" rx="2" fill="#3A4953"/>
          <rect x="20" y="30" width="80" height="6" rx="2" fill="#BECBCF"/>
          <path d="M170 24 L186 24" stroke="#BECBCF" stroke-width="2"/>
          <rect x="200" y="12" width="180" height="24" rx="3" fill="#fff" stroke="#41AF4B" stroke-width="2"/>
          <rect x="210" y="20" width="100" height="8" rx="2" fill="#41AF4B"/>
        </g>
        <g transform="translate(40 230)">
          <rect width="400" height="48" rx="3" fill="#fff" stroke="#058DE9" stroke-width="2"/>
          <rect x="-2" y="0" width="6" height="48" fill="#058DE9"/>
          <rect x="20" y="14" width="140" height="10" rx="2" fill="#3A4953"/>
          <rect x="20" y="30" width="100" height="6" rx="2" fill="#BECBCF"/>
          <path d="M170 24 L186 24" stroke="#BECBCF" stroke-width="2"/>
          <rect x="200" y="12" width="180" height="24" rx="3" fill="#fff" stroke="#058DE9" stroke-width="2"/>
          <text x="206" y="29" font-family="Lato, sans-serif" font-size="11" font-weight="900" fill="#fff">
            <tspan dx="0" dy="0" fill="#058DE9">+ Custom</tspan>
          </text>
        </g>
        <g transform="translate(40 290)">
          <rect width="400" height="48" rx="3" fill="#fff" stroke="#B47A00" stroke-width="2"/>
          <rect x="-2" y="0" width="6" height="48" fill="#B47A00"/>
          <rect x="20" y="14" width="100" height="10" rx="2" fill="#3A4953"/>
          <rect x="20" y="30" width="60" height="6" rx="2" fill="#BECBCF"/>
          <path d="M170 24 L186 24" stroke="#BECBCF" stroke-width="2"/>
          <rect x="200" y="12" width="180" height="24" rx="3" fill="#fff" stroke="#B47A00" stroke-width="2"/>
          <rect x="210" y="20" width="120" height="8" rx="2" fill="#B47A00"/>
        </g>
        <!-- Action bar -->
        <g transform="translate(40 370)">
          <rect x="280" width="120" height="36" rx="3" fill="#41AF4B"/>
          <text x="340" y="23" font-family="Lato, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Continue</text>
        </g>
      </g>
    </svg>
  </template>

  <!-- Sample files used by the "Messy real upload" demo. Bundled inline. -->
  <meta name="ext-resource-dependency" content="uploads/JOOR_Full_Access_Linesheet_Template.xlsx" data-resource-id="sample_joor">
  <meta name="ext-resource-dependency" content="uploads/Le New Black Company Data Template.xlsx" data-resource-id="sample_lnb_company">
  <meta name="ext-resource-dependency" content="uploads/Le New Black Pricesheet Template.xlsx" data-resource-id="sample_lnb_pricing">
  <meta name="ext-resource-dependency" content="uploads/Le New Black Product Data Template.xlsx" data-resource-id="sample_lnb_product">
  <meta name="ext-resource-dependency" content="uploads/Shopify Products_export.xlsx" data-resource-id="sample_shopify_a">
  <meta name="ext-resource-dependency" content="uploads/shopify_products_export_1.xlsx" data-resource-id="sample_shopify_b">
  <meta name="ext-resource-dependency" content="uploads/XO_Maria_Shopify_Export.xlsx" data-resource-id="sample_xo_maria">

  <!-- SheetJS for XLSX parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Plain helpers first (no JSX) -->
  <script src="app/samples.js"></script>
  <script src="app/file-parser.js"></script>
  <script src="app/ai-triage.js"></script>
  <script src="app/ai-mapping.js"></script>

  <!-- JSX components — load primitives first, then chrome, screens, app last -->
  <script type="text/babel" src="app/Primitives.jsx"></script>
  <script type="text/babel" src="app/tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/TopChrome.jsx"></script>
  <script type="text/babel" src="app/Stepper.jsx"></script>
  <script type="text/babel" src="app/UploadStep.jsx"></script>
  <script type="text/babel" src="app/MappingStep.jsx"></script>
  <script type="text/babel" src="app/ValidationStep.jsx"></script>
  <script type="text/babel" src="app/SuccessStep.jsx"></script>
  <script type="text/babel" src="app/App.jsx"></script>
</body>
</html>
