<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mapping engine tests · NuORDER</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --pass: #41AF4B; --fail: #E6643C; --ink: #3A4953; --line: #BECBCF; --bg: #F0F4F4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); padding: 32px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6b7780; font-size: 13px; margin-bottom: 20px; }
    .summary { padding: 14px 18px; border-radius: 4px; font-weight: 700; font-size: 15px; margin-bottom: 20px; background: #e7eaec; }
    .summary.all-pass { background: rgba(65,175,75,0.14); color: #1F7A2A; }
    .summary.has-fail { background: rgba(230,100,60,0.14); color: #B23A1A; }
    .suite { background: #fff; border: 2px solid var(--line); border-radius: 4px; margin-bottom: 16px; overflow: hidden; }
    .suite-title { font-size: 14px; margin: 0; padding: 12px 16px; background: #f4f6f6; border-bottom: 1px solid var(--line); }
    .case { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-top: 1px solid #eef1f1; flex-wrap: wrap; }
    .case:first-of-type { border-top: 0; }
    .badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; color: #fff; letter-spacing: .04em; }
    .pass .badge { background: var(--pass); }
    .failcase .badge { background: var(--fail); }
    .case-name { flex: 1; font-size: 13px; }
    .case-ms { font-size: 11px; color: #9aa4ab; font-variant-numeric: tabular-nums; }
    .err { width: 100%; margin: 6px 0 0; padding: 8px 10px; background: rgba(230,100,60,0.08); color: #B23A1A; border-radius: 3px; font-size: 12px; white-space: pre-wrap; }
  </style>

  <!-- SheetJS not needed for tests (CSV fixtures only) -->
  <!-- Engine modules under test — plain JS, no Babel -->
  <script src="../app/samples.js"></script>
  <script src="../app/file-parser.js"></script>
  <script src="../app/row-normalizer.js"></script>
  <script src="../app/transforms.js"></script>
  <script src="../app/ai-mapping.js"></script>
  <script src="../app/validate.js"></script>
</head>
<body>
  <h1>Mapping engine — unit tests</h1>
  <div class="sub">Runs against the live <code>app/</code> engine modules. No build step, no Babel.</div>
  <div id="summary" class="summary">Running…</div>
  <div id="results"></div>

  <script src="test-runner.js"></script>
  <script src="mapping.tests.js"></script>
  <script>
    // window.claude is intentionally absent → buildMappingsDeterministic and the
    // deterministic paths are exercised directly.
    runAll();
  </script>
</body>
</html>
